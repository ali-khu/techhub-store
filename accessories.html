<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories | iTradehub</title>
    <link rel="icon" type="image/jpeg" href="assets/itradehub.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { apple: '#1d1d1f', primary: '#2997ff', whatsapp: '#25D366' } } } }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1); }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-x-hidden flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="glass border-b border-gray-200 sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex-shrink-0 flex items-center cursor-pointer group">
                    <img src="assets/itradehub.jpg" alt="Logo" class="h-8 w-8 rounded-full object-cover shadow-sm mr-3 transition-transform group-hover:scale-110">
                    <span class="font-bold text-xl tracking-tight text-apple">iTradehub</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-apple text-sm font-semibold transition">Phones</a>
                    <a href="accessories.html" class="text-primary hover:text-primaryDark text-sm font-semibold transition">Accessories</a>
                    <a href="quiz.html" class="text-gray-600 hover:text-apple text-sm font-semibold transition">Best Device Test</a>
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-800 hover:text-primary focus:outline-none transition"><i class="fa-solid fa-bars text-2xl"></i></button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200 absolute w-full shadow-lg">
            <div class="px-4 py-3 space-y-3 flex flex-col">
                <a href="index.html" class="block text-base font-semibold text-gray-700 hover:text-apple">Phones</a>
                <a href="accessories.html" class="block text-base font-bold text-primary">Accessories</a>
                <a href="quiz.html" class="block text-base font-semibold text-gray-700 hover:text-apple">Best Device Test</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-extrabold text-apple">Premium Accessories</h1>
                <p class="text-gray-500 mt-4 text-lg">Enhance your device with top-tier chargers, audio, and protection.</p>
            </div>
            <div id="accessories-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Javascript will inject cards here -->
            </div>
        </div>
    </main>

    <!-- WhatsApp Quick Order Modal -->
    <div id="quickViewModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 sm:p-6 bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl overflow-hidden shadow-2xl w-full max-w-lg relative" id="modalContent">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-gray-100 hover:bg-gray-200 text-gray-800 w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            <div class="p-8">
                <h2 id="modalTitle" class="text-2xl font-bold text-apple mb-2"></h2>
                <div id="modalPrice" class="text-xl font-bold text-primary mb-6"></div>
                <button id="modalOrderBtn" class="w-full bg-apple hover:bg-black text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition-colors flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-whatsapp text-xl"></i><span>Order on WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => { document.getElementById('mobile-menu').classList.toggle('hidden'); });

        // Add your real accessories here!
        const accessories = [
            { id: 101, name: "Apple 20W USB-C Power Adapter", brand: "Apple", price: "Rs. 5,500", image: "https://via.placeholder.com/300x300?text=Charger" },
            { id: 102, name: "AirPods Pro (2nd Gen)", brand: "Apple", price: "Rs. 65,000", image: "https://via.placeholder.com/300x300?text=AirPods" },
            { id: 103, name: "Premium Silicone Case (All Models)", brand: "Accessory", price: "Rs. 1,500", image: "https://via.placeholder.com/300x300?text=Case" },
            { id: 104, name: "9D Glass Screen Protector", brand: "Accessory", price: "Rs. 800", image: "https://via.placeholder.com/300x300?text=Protector" }
        ];

        function openModal(id) {
            const acc = accessories.find(a => a.id === id);
            document.getElementById('modalTitle').innerText = acc.name;
            document.getElementById('modalPrice').innerText = acc.price;
            document.getElementById('modalOrderBtn').onclick = () => window.open(`https://wa.me/923393336999?text=Hello! I want to order the ${acc.name} (${acc.price})`, '_blank');
            document.getElementById('quickViewModal').classList.add('modal-active');
        }
        function closeModal() { document.getElementById('quickViewModal').classList.remove('modal-active'); }

        document.getElementById('accessories-container').innerHTML = accessories.map(acc => `
            <div class="product-card bg-white rounded-2xl border border-gray-100 overflow-hidden cursor-pointer flex flex-col group" onclick="openModal(${acc.id})">
                <div class="h-48 overflow-hidden relative bg-gray-50 flex justify-center items-center p-4">
                    <span class="absolute top-2 left-2 bg-white/80 text-apple text-[10px] font-bold px-2 py-0.5 rounded-full">${acc.brand}</span>
                    <img src="${acc.image}" class="w-full h-full object-contain mix-blend-multiply">
                </div>
                <div class="p-5 flex-grow flex flex-col">
                    <h3 class="text-sm font-bold text-apple mb-4">${acc.name}</h3>
                    <div class="mt-auto flex justify-between items-center">
                        <span class="text-lg font-extrabold text-apple">${acc.price}</span>
                        <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center group-hover:bg-primary group-hover:text-white text-gray-400"><i class="fa-solid fa-arrow-right text-xs"></i></div>
                    </div>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
