<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Device Quiz | iTradehub</title>
    
    <!-- Meta Tags for SEO -->
    <meta name="description" content="Take the iTradehub Best Device Test to find the perfect premium smartphone for your needs and budget.">
    <meta property="og:title" content="Best Device Quiz | iTradehub">
    <meta property="og:description" content="Find your perfect premium smartphone match.">
    <meta property="og:image" content="assets/itradehub.jpg">

    <link rel="icon" type="image/jpeg" href="assets/itradehub.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { apple: '#1d1d1f', primary: '#2997ff', whatsapp: '#25D366' } } } }
    </script>
    
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-x-hidden flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="glass border-b border-gray-200 sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                
                <!-- Logo -->
                <a href="index.html" class="flex-shrink-0 flex items-center cursor-pointer group">
                    <img src="assets/itradehub.jpg" alt="Logo" class="h-8 w-8 rounded-full object-cover shadow-sm mr-3 transition-transform group-hover:scale-110">
                    <span class="font-bold text-xl tracking-tight text-apple">iTradehub</span>
                </a>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-apple text-sm font-semibold transition">Phones</a>
                    <a href="accessories.html" class="text-gray-600 hover:text-apple text-sm font-semibold transition">Accessories</a>
                    <!-- Highlighted Active Link -->
                    <a href="quiz.html" class="text-primary hover:text-primaryDark text-sm font-semibold transition">Best Device Test</a>
                </div>
                
                <!-- Mobile Hamburger Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-800 hover:text-primary focus:outline-none transition">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200 absolute w-full shadow-lg">
            <div class="px-4 py-3 space-y-3 flex flex-col">
                <a href="index.html" class="block text-base font-semibold text-gray-700 hover:text-apple">Phones</a>
                <a href="accessories.html" class="block text-base font-semibold text-gray-700 hover:text-apple">Accessories</a>
                <!-- Highlighted Active Link -->
                <a href="quiz.html" class="block text-base font-bold text-primary">Best Device Test</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow py-16 flex items-center justify-center">
        <div class="max-w-3xl w-full mx-auto px-4 sm:px-6">
            <div class="text-center mb-10">
                <i class="fa-solid fa-wand-magic-sparkles text-5xl text-primary mb-4 block"></i>
                <h1 class="text-4xl font-extrabold text-apple">Find Your Perfect Phone</h1>
                <p class="text-gray-500 mt-4 text-lg">Answer 2 quick questions to get a personalized recommendation.</p>
            </div>

            <div class="bg-white p-8 md:p-12 rounded-3xl border border-gray-200 shadow-xl text-center min-h-[300px] flex flex-col justify-center">
                
                <!-- Step 1 -->
                <div id="quiz-step-1" class="block">
                    <h3 class="text-2xl font-bold mb-8">What do you care about most?</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onclick="nextStep(2, 'camera')" class="py-6 px-4 border-2 border-gray-100 rounded-2xl hover:border-primary hover:bg-blue-50 transition font-bold text-lg text-gray-700 hover:text-primary">📸 Amazing Camera</button>
                        <button onclick="nextStep(2, 'performance')" class="py-6 px-4 border-2 border-gray-100 rounded-2xl hover:border-primary hover:bg-blue-50 transition font-bold text-lg text-gray-700 hover:text-primary">🎮 Fast Performance / Gaming</button>
                    </div>
                </div>

                <!-- Step 2 -->
                <div id="quiz-step-2" class="hidden">
                    <h3 class="text-2xl font-bold mb-8">What is your budget?</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onclick="showResult(60000)" class="py-4 px-2 border-2 border-gray-100 rounded-2xl hover:border-primary hover:bg-blue-50 transition font-bold text-gray-700 hover:text-primary">Under Rs. 60K</button>
                        <button onclick="showResult(150000)" class="py-4 px-2 border-2 border-gray-100 rounded-2xl hover:border-primary hover:bg-blue-50 transition font-bold text-gray-700 hover:text-primary">Rs. 60K - 150K</button>
                        <button onclick="showResult(9999999)" class="py-4 px-2 border-2 border-gray-100 rounded-2xl hover:border-primary hover:bg-blue-50 transition font-bold text-gray-700 hover:text-primary">No Limit (Premium)</button>
                    </div>
                </div>

                <!-- Result -->
                <div id="quiz-result" class="hidden">
                    <h3 class="text-2xl font-bold mb-2 text-green-500"><i class="fa-solid fa-circle-check mr-2"></i>We found your match!</h3>
                    <div id="recommendation-box" class="my-8 max-w-sm mx-auto bg-gray-50 rounded-2xl border border-gray-200 p-6">
                        <!-- Recommendation populated here by Javascript -->
                    </div>
                    <button onclick="location.reload()" class="text-primary font-semibold hover:underline">Retake Quiz</button>
                </div>

            </div>
        </div>
    </main>

    <!-- IMPORTANT: Import data.js BEFORE your main script -->
    <script src="data.js"></script>

    <script>
        // Mobile Menu Toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => { 
            document.getElementById('mobile-menu').classList.toggle('hidden'); 
        });

        let preference = '';

        function nextStep(step, pref) {
            preference = pref;
            document.getElementById('quiz-step-1').classList.add('hidden');
            document.getElementById('quiz-step-2').classList.remove('hidden');
        }

        function showResult(budgetLimit) {
            document.getElementById('quiz-step-2').classList.add('hidden');
            
            // Find all phones under budget using the global 'phones' array from data.js
            // Note: This relies on you having the 'priceVal' property on your phones in data.js!
            let affordable = phones.filter(p => p.priceVal && p.priceVal <= budgetLimit);
            
            // If they picked an impossible budget (or if priceVal is missing), give them the cheapest phone
            if (affordable.length === 0) {
                affordable = [phones.reduce((prev, curr) => (prev.priceVal < curr.priceVal ? prev : curr))];
            }
            
            // Recommend the most expensive phone they can afford within that bracket
            affordable.sort((a, b) => b.priceVal - a.priceVal);
            const recommended = affordable[0];

            // Generate HTML for the recommended phone
            document.getElementById('recommendation-box').innerHTML = `
                <img src="${recommended.image}" loading="lazy" class="h-40 mx-auto object-contain mb-4 mix-blend-multiply" onerror="this.src='https://via.placeholder.com/300x300?text=Phone'">
                <h4 class="text-xl font-bold text-apple">${recommended.name}</h4>
                <p class="text-lg text-primary font-extrabold my-2">${recommended.price}</p>
                <button onclick="window.open('https://wa.me/${BUSINESS_WHATSAPP_NUMBER}?text=I got recommended the ${recommended.name} via the Quiz!', '_blank')" class="mt-4 block w-full bg-apple text-white py-2 rounded-xl hover:bg-black font-semibold transition">
                    Buy Now
                </button>
            `;
            
            document.getElementById('quiz-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
